openapi: 3.1.0
info:
  title: Retriva Gateway API
  description: |
    Retriva Gateway acts as the Backend-for-Frontend (BFF) for the Retriva WebUI
    and provides a public-facing API for external integrations.

    It exposes:
    * `/gateway/*`: Backend-for-Frontend (BFF) routes specifically designed for the WebUI.
    * `/api/v2/*`: Public-facing modern API routes.
  version: 0.1.0
  contact:
    name: Andrea Marson
    email: am.dev.75@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8002
    description: Retriva Gateway API

tags:
  - name: Gateway BFF
    description: WebUI Backend-for-Frontend endpoints
  - name: Connected Sources
    description: Dynamic ingestion source management
  - name: Connected Sources v2
    description: Dynamic ingestion source management (v2)
  - name: Internal
    description: Internal worker API for connector processes
  - name: Documents v2
    description: Document management (v2)
  - name: Ingestion v2
    description: Document ingestion (v2)
  - name: Metadata v2
    description: Metadata discovery (v2)
  - name: Artifacts v2
    description: Artifact management (v2)
  - name: Capabilities v2
    description: System capabilities (v2)
  - name: Health
    description: System health and status

  - name: crm-assistant
  - name: documents
  - name: ingestion
  - name: sessions
  - name: stt
  - name: system
paths:
  # --- Gateway BFF API ---
  /gateway/health:
    get:
      tags: [Gateway BFF]
      summary: Get health status
      operationId: getGatewayHealth
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /gateway/capabilities:
    get:
      tags: [Gateway BFF]
      summary: Get Gateway capabilities
      operationId: getGatewayCapabilities
      responses:
        "200":
          description: Enabled features report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /gateway/chat:
    post:
      tags: [Gateway BFF]
      summary: Send a direct RAG chat message
      operationId: sendGatewayChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: WebUI friendly chat response or event stream
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      id: { type: string }
                      role: { type: string }
                      content: { type: string }
                      timestamp: { type: string }
                      citations:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            document_id: { type: string }
                            filename: { type: string }
                            text: { type: string }
                  - type: string
                    format: binary
                    description: Server-Sent Events stream

  /gateway/kbs:
    get:
      tags: [Gateway BFF]
      summary: List knowledge bases
      operationId: listGatewayKbs
      responses:
        "200":
          description: KB list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      tags: [Gateway BFF]
      summary: Create a knowledge base
      operationId: createGatewayKb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KBCreate"
      responses:
        "200":
          description: KB created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"

  /gateway/kbs/{kb_id}:
    get:
      tags: [Gateway BFF]
      summary: Get knowledge base details
      operationId: getGatewayKb
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KB details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "404":
          description: KB not found
    patch:
      tags: [Gateway BFF]
      summary: Update knowledge base details
      operationId: updateGatewayKb
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KBUpdate"
      responses:
        "200":
          description: KB updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    delete:
      tags: [Gateway BFF]
      summary: Delete knowledge base
      operationId: deleteGatewayKb
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KB deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /gateway/ingestion/batches:
    post:
      tags: [Gateway BFF]
      summary: Create ingestion batch
      operationId: createGatewayBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties: {}
                source_type:
                  type: string
                  default: auto
                  description: |
                    Ingestion source type hint.  When set to `mediawiki_export`,
                    the batch is routed to local staging for MediaWiki XML
                    processing instead of direct file upload.
      responses:
        "200":
          description: Ingestion batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string }
                  status: { type: string }
                  files:
                    type: array
                    items: { type: object }
                  metadata:
                    type: object

  /gateway/ingestion/batches/{batch_id}/files:
    post:
      tags: [Gateway BFF]
      summary: Upload file to batch
      operationId: uploadGatewayFileToBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_path]
              properties:
                file:
                  type: string
                  format: binary
                source_path:
                  type: string
                user_metadata:
                  type: string
                  description: Optional JSON-encoded metadata string
                kb_id:
                  type: string
                  default: default
                  description: Target knowledge base id.
                force:
                  type: boolean
                  default: false
                  description: |
                    Force re-ingestion even if a catalog record already exists
                    for the same content hash.  Forwarded to Retriva Core.
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: { type: string }
                  source_path: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "404":
          description: Batch not found
        "422":
          description: Invalid JSON in user_metadata

  /gateway/ingestion/batches/{batch_id}:
    get:
      tags: [Gateway BFF]
      summary: Get batch status
      operationId: getGatewayBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch status report
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string }
                  status: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        source_path: { type: string }
                        job_id: { type: string }
                        status: { type: string }
                  metadata:
                    type: object

  /gateway/ingestion/batches/{batch_id}/finalize:
    post:
      tags: [Gateway BFF]
      summary: Finalize an ingestion batch
      description: |
        Triggers final processing of a batch (e.g. for `mediawiki_export`
        source type, this starts the MediaWiki XML ingestion job).
        Has no effect on regular file-upload batches that are already
        processed incrementally.
      operationId: finalizeGatewayBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
        "404":
          description: Batch not found
        "400":
          description: Batch cannot be finalized in its current state

  /gateway/documents:
    get:
      tags: [Gateway BFF]
      summary: List KB documents
      operationId: listGatewayDocuments
      parameters:
        - name: kb_id
          in: query
          required: false
          schema:
            type: string
        - name: metadata_filter_mode
          in: query
          schema:
            $ref: "#/components/schemas/MetadataFilterMode"
            default: hard
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /gateway/documents/search:
    post:
      tags: [Gateway BFF]
      summary: Discover and search documents (tags + filename only, metadata_filter_mode ignored)
      operationId: searchGatewayDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /gateway/documents/filter:
    post:
      tags: [Gateway BFF]
      summary: Filter documents (POST compat redirect)
      operationId: filterGatewayDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Filter results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /gateway/documents/{doc_id}:
    get:
      tags: [Gateway BFF]
      summary: Get document details
      operationId: getGatewayDocument
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
    delete:
      tags: [Gateway BFF]
      summary: Delete document
      operationId: deleteGatewayDocument
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted

  /gateway/metadata/schema:
    get:
      tags: [Gateway BFF]
      summary: Get metadata schema
      operationId: getGatewayMetadataSchema
      responses:
        "200":
          description: Metadata field structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSchemaResponse"

  /gateway/metadata/values:
    get:
      tags: [Gateway BFF]
      summary: Get metadata key values
      operationId: getGatewayMetadataValues
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  /gateway/metadata/{field}/values:
    get:
      tags: [Gateway BFF]
      summary: Get metadata field values (legacy/compat route)
      operationId: getGatewayMetadataValuesCompat
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  /gateway/artifacts:
    get:
      tags: [Gateway BFF]
      summary: List all artifacts
      operationId: listGatewayArtifacts
      responses:
        "200":
          description: List of artifacts
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
    post:
      tags: [Gateway BFF]
      summary: Create artifact generation job
      operationId: createGatewayArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRequest"
      responses:
        "202":
          description: Generation job accepted

  /gateway/artifacts/{artifact_id}:
    get:
      tags: [Gateway BFF]
      summary: Get artifact details/status
      operationId: getGatewayArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact status details
    delete:
      tags: [Gateway BFF]
      summary: Delete artifact
      operationId: deleteGatewayArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact deleted

  /gateway/artifacts/{artifact_id}/content:
    get:
      tags: [Gateway BFF]
      summary: Stream artifact rendered content
      operationId: downloadGatewayArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streaming file

  /gateway/stt/transcribe:
    post:
      tags: [Gateway BFF]
      summary: Transcribe an audio file
      operationId: transcribeGatewayAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                  description: Optional language hint (ISO 639-1)
                prompt:
                  type: string
                  description: Optional transcription prompt
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: Empty or invalid audio file
        "413":
          description: Audio file too large
        "503":
          description: Speech-to-text is disabled

  /gateway/stt/health:
    get:
      tags: [Gateway BFF]
      summary: Check speech-to-text service health
      operationId: getGatewaySttHealth
      responses:
        "200":
          description: STT health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  whisper_url_configured: { type: boolean }

  # --- System status (Gateway BFF) ---
  /gateway/system/status:
    get:
      tags: [Gateway BFF]
      summary: Get system status summary
      operationId: getSystemStatus
      responses:
        "200":
          description: System status with job counts and staged file count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"

  /gateway/system/status/detail:
    get:
      tags: [Gateway BFF]
      summary: Get detailed system status (includes full job list)
      operationId: getSystemStatusDetail
      responses:
        "200":
          description: Detailed system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusDetailResponse"

  /gateway/system/jobs:
    get:
      tags: [Gateway BFF]
      summary: List recent ingestion jobs
      operationId: listSystemJobs
      responses:
        "200":
          description: List of job summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"

  /gateway/system/jobs/{job_id}:
    get:
      tags: [Gateway BFF]
      summary: Get a specific job summary
      operationId: getSystemJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummary"
        "404":
          description: Job not found

  # --- Public API v2 Proxy Routes ---
  /api/v2/documents:
    get:
      tags: [Documents v2]
      summary: List documents
      operationId: listDocumentsV2
      parameters:
        - name: user_metadata_filter
          in: query
          schema:
            type: string
        - name: metadata_filter_mode
          in: query
          schema:
            type: string
            enum: [hard, soft]
            default: hard
          description: How strictly metadata filters are applied during retrieval.
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /api/v2/documents/count:
    get:
      tags: [Documents v2]
      summary: Count documents
      operationId: countDocumentsV2
      parameters:
        - name: user_metadata_filter
          in: query
          schema:
            type: string
        - name: metadata_filter_mode
          in: query
          schema:
            type: string
            enum: [hard, soft]
            default: hard
      responses:
        "200":
          description: Document count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /api/v2/documents/search:
    post:
      tags: [Documents v2]
      summary: Search documents
      operationId: searchDocumentsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /api/v2/documents/filter:
    post:
      tags: [Documents v2]
      summary: Filter documents
      operationId: filterDocumentsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Filter results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /api/v2/documents/{doc_id}:
    get:
      tags: [Documents v2]
      summary: Get document details
      operationId: getDocumentV2
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
    delete:
      tags: [Documents v2]
      summary: Delete document
      operationId: deleteDocumentV2
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted

  /api/v2/metadata/schema:
    get:
      tags: [Metadata v2]
      summary: Get metadata schema
      operationId: getMetadataSchemaV2
      responses:
        "200":
          description: Metadata field structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSchemaResponse"

  /api/v2/metadata/values:
    get:
      tags: [Metadata v2]
      summary: Get metadata key values
      operationId: getMetadataValuesV2
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  /api/v2/metadata/{field}/values:
    get:
      tags: [Metadata v2]
      summary: Get metadata field values (legacy/compat route)
      operationId: getMetadataValuesCompatV2
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  /api/v2/ingestion/batches:
    post:
      tags: [Ingestion v2]
      summary: Create ingestion batch
      operationId: createBatchV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties: {}
                source_type:
                  type: string
                  default: auto
                  description: Ingestion source type hint (e.g. `mediawiki_export`).
      responses:
        "200":
          description: Ingestion batch created

  /api/v2/ingestion/batches/{batch_id}/files:
    post:
      tags: [Ingestion v2]
      summary: Upload file to batch
      operationId: uploadFileToBatchV2
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_path]
              properties:
                file:
                  type: string
                  format: binary
                source_path:
                  type: string
                user_metadata:
                  type: string
                  description: Optional JSON-encoded metadata string
                kb_id:
                  type: string
                  default: default
                  description: Target knowledge base id.
                force:
                  type: boolean
                  default: false
                  description: Force re-ingestion even if a catalog record already exists.
      responses:
        "200":
          description: File uploaded
        "404":
          description: Batch not found
        "422":
          description: Invalid JSON in user_metadata

  /api/v2/ingestion/batches/{batch_id}:
    get:
      tags: [Ingestion v2]
      summary: Get batch status
      operationId: getBatchV2
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch status report

  /api/v2/ingestion/batches/{batch_id}/finalize:
    post:
      tags: [Ingestion v2]
      summary: Finalize an ingestion batch
      operationId: finalizeBatchV2
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
        "404":
          description: Batch not found
        "400":
          description: Batch cannot be finalized in its current state

  /api/v2/artifacts:
    get:
      tags: [Artifacts v2]
      summary: List all artifacts
      operationId: listArtifactsV2
      responses:
        "200":
          description: List of artifacts
    post:
      tags: [Artifacts v2]
      summary: Create artifact generation job
      operationId: createArtifactV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRequest"
      responses:
        "202":
          description: Generation job accepted

  /api/v2/artifacts/{artifact_id}:
    get:
      tags: [Artifacts v2]
      summary: Get artifact details/status
      operationId: getArtifactV2
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact status details
    delete:
      tags: [Artifacts v2]
      summary: Delete artifact
      operationId: deleteArtifactV2
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact deleted

  /api/v2/artifacts/{artifact_id}/content:
    get:
      tags: [Artifacts v2]
      summary: Stream artifact rendered content
      operationId: downloadArtifactV2
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streaming file

  /api/v2/capabilities:
    get:
      tags: [Capabilities v2]
      summary: Get system capabilities
      operationId: getCapabilitiesV2
      responses:
        "200":
          description: System capabilities report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  # --- Connected Sources (Dynamic Ingestion) v2 Proxy Routes ---
  /api/v2/sources:
    post:
      tags: [Connected Sources v2]
      summary: Create a connected source
      operationId: createSourceV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
