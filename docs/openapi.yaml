components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, default: healthy }
        version: { type: string, default: 0.1.0 }

    CapabilitiesResponse:
      type: object
      properties:
        chat: { type: boolean }
        knowledge_bases: { type: boolean }
        documents: { type: boolean }
        ingestion: { type: boolean }
        artifacts: { type: boolean }
        folder_upload: { type: boolean }
        speech_input: { type: boolean }
        auth: { type: boolean }

    KnowledgeBase:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        document_count: { type: integer, default: 0 }
        status: { type: string, default: active }

    KBCreate:
      type: object
      required: [name]
      properties:
        kb_id: { type: string }
        name: { type: string }
        description: { type: string }

    KBUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        kb_ids:
          type: array
          items: { type: string }
          default: [default]
        metadata_filters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
        metadata_filter_mode:
          $ref: "#/components/schemas/MetadataFilterMode"
          default: soft
        stream: { type: boolean, default: false }
        filters:
          type: object
          description: "[DEPRECATED] Legacy search filter dict."

    SearchRequest:
      type: object
      properties:
        query: { type: string }
        kb_ids:
          type: array
          items: { type: string }
          default: [default]
        metadata_filters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
        metadata_filter_mode:
          $ref: "#/components/schemas/MetadataFilterMode"
          default: soft
          description: >-
            Filtering mode for RAG/chat queries only. Ignored for document
            discovery (POST /gateway/documents/search) where tags are always
            applied as strict filters.
        limit: { type: integer, default: 50 }
        is_discovery: { type: boolean, default: false }
        case_sensitive: { type: boolean, default: false }
        filters:
          type: object
          description: "[DEPRECATED] Legacy search filter dict."

    ArtifactRequest:
      type: object
      required: [artifact_type, format]
      properties:
        artifact_type: { type: string }
        format: { type: string }
        parameters:
          type: object
          additionalProperties: {}

    MetadataFilterOperator:
      type: string
      enum: [eq, neq, contains, in, exists]

    MetadataFilter:
      type: object
      required: [field, operator]
      properties:
        field: { type: string }
        operator:
          $ref: "#/components/schemas/MetadataFilterOperator"
        value: {}

    MetadataFilterMode:
      type: string
      enum: [soft, hard]

    MetadataFieldSchema:
      type: object
      required: [field, type, operators]
      properties:
        field: { type: string }
        type: { type: string }
        operators:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilterOperator"

    MetadataValueInfo:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    MetadataSchemaResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFieldSchema"

    MetadataValuesResponse:
      type: object
      required: [key, values]
      properties:
        key: { type: string }
        values:
          type: array
          items:
            $ref: "#/components/schemas/MetadataValueInfo"

    DocumentResponse:
      type: object
      required: [id, doc_id, source_path, page_title]
      properties:
        id: { type: string }
        doc_id: { type: string }
        kb_id: { type: string, default: default }
        filename: { type: string }
        size: { type: integer, default: 0 }
        ingestion_status: { type: string, default: completed }
        created_at: { type: string }
        source_path: { type: string }
        page_title: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        match_reasons:
          type: array
          items: { type: string }

    # --- Connected Sources schemas ---
    SourceStatus:
      type: string
      enum: [CREATED, VALIDATING_CONNECTION, BASELINE_PENDING, BASELINE_RUNNING, CATCHUP_RUNNING, ACTIVE, PAUSED, DEGRADED, FAILED, DELETING, DELETED]

    SyncMode:
      type: string
      enum: [baseline, catchup, incremental]

    ConnectorType:
      type: string
      enum: [mediawiki]

    RunPhase:
      type: string
      enum: [baseline_scan, catchup, incremental, validation]

    RunStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]

    ItemStatus:
      type: string
      enum: [pending, indexed, deleted, error]

    CreateSourceRequest:
      type: object
      required: [connector_type, display_name, target_kb_id]
      properties:
        connector_type: { type: string }
        display_name: { type: string }
        target_kb_id: { type: string }
        config: { type: object, additionalProperties: {} }
        secret_ref: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: {} }
        schedule: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }

    UpdateSourceRequest:
      type: object
      properties:
        display_name: { type: string }
        config: { type: object, additionalProperties: {} }
        schedule: { type: string }
        metadata: { type: object, additionalProperties: {} }

    SourceResponse:
      type: object
      required: [source_id, tenant_id, connector_type, display_name, target_kb_id, status, sync_mode, created_at, updated_at]
      properties:
        source_id: { type: string }
        tenant_id: { type: string }
        connector_type: { type: string }
        display_name: { type: string }
        target_kb_id: { type: string }
        status:
          $ref: "#/components/schemas/SourceStatus"
        sync_mode:
          $ref: "#/components/schemas/SyncMode"
        schedule: { type: string, nullable: true }
        config: { type: object, additionalProperties: {} }
        has_secret: { type: boolean }
        metadata: { type: object, additionalProperties: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceRunResponse:
      type: object
      required: [run_id, source_id, phase, status, started_at]
      properties:
        run_id: { type: string }
        source_id: { type: string }
        phase:
          $ref: "#/components/schemas/RunPhase"
        status:
          $ref: "#/components/schemas/RunStatus"
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        processed_items: { type: integer, default: 0 }
        failed_items: { type: integer, default: 0 }
        skipped_items: { type: integer, default: 0 }
        error_code: { type: string, nullable: true }

    SourceStatusResponse:
      type: object
      required: [source_id, status, sync_mode]
      properties:
        source_id: { type: string }
        status:
          $ref: "#/components/schemas/SourceStatus"
        sync_mode:
          $ref: "#/components/schemas/SyncMode"
        latest_run:
          $ref: "#/components/schemas/SourceRunResponse"
        has_checkpoint: { type: boolean }

    SourceItemState:
      type: object
      required: [source_id, source_item_id]
      properties:
        source_id: { type: string }
        source_item_id: { type: string }
        source_revision: { type: string, nullable: true }
        retriva_doc_id: { type: string, nullable: true }
        content_hash: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/ItemStatus"
